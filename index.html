<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BurgerMaster Pro</title>

<style>
:root{
--primary:#f59e0b;
--secondary:#1f2937;
--bg:#f3f4f6;
--card:#fff;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI;}

body{background:var(--bg);color:var(--text);}

/* HEADER MOBILE */
.header{
position:fixed;
top:0;left:0;right:0;
height:56px;
background:var(--secondary);
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
z-index:1000;
}

.header h1{font-size:1rem;color:var(--primary);}

.menu-btn{
background:none;
border:none;
font-size:1.4rem;
color:#fff;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:56px;
left:-260px;
width:260px;
height:calc(100vh - 56px);
background:var(--secondary);
color:#fff;
transition:.3s;
z-index:999;
padding:12px;
overflow-y:auto;
}

.sidebar.open{left:0;}

.nav-item{
padding:12px;
border-radius:8px;
margin-bottom:6px;
cursor:pointer;
color:#d1d5db;
}

.nav-item.active,
.nav-item:hover{
background:var(--primary);
color:#fff;
}

/* MAIN */
.main{
padding:72px 12px 16px;
max-width:1200px;
margin:auto;
}

/* CARDS */
.card{
background:var(--card);
border-radius:12px;
padding:16px;
margin-bottom:16px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.card-title{
font-weight:600;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* GRID */
.grid{
display:grid;
gap:12px;
grid-template-columns:1fr;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat{
background:#fff;
padding:12px;
border-radius:10px;
border-left:4px solid var(--primary);
}

.stat small{color:var(--muted);}
.stat strong{display:block;font-size:1.1rem;margin-top:4px;}

/* BUTTONS */
.btn{
padding:10px 14px;
border-radius:8px;
border:none;
font-weight:600;
cursor:pointer;
}

.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:none;border:1px solid var(--border);}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
th,td{padding:10px;border-bottom:1px solid var(--border);font-size:.9rem;}
th{text-transform:uppercase;font-size:.7rem;color:var(--muted);}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
padding:12px;
z-index:2000;
}

.modal.open{display:flex;}

.modal-content{
background:#fff;
width:100%;
max-width:500px;
border-radius:12px;
padding:16px;
max-height:90vh;
overflow-y:auto;
}

/* DESKTOP */
@media(min-width:900px){
.header{display:none;}
.sidebar{
left:0;
top:0;
height:100vh;
}
.main{
padding:24px 24px 24px 300px;
}
.grid{grid-template-columns:repeat(2,1fr);}
.stats{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<body>

<!-- HEADER MOBILE -->
<header class="header">
<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<h1>🍔 BurgerMaster</h1>
</header>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<div class="nav-item active" onclick="showModule('indicadores')">📊 Indicadores</div>
<div class="nav-item" onclick="showModule('ingredientes')">🥬 Ingredientes</div>
<div class="nav-item" onclick="showModule('fichas')">📋 Fichas</div>
<div class="nav-item" onclick="showModule('lanches')">🥪 Cardápio</div>
<div class="nav-item" onclick="showModule('producao')">💰 Produção</div>
<div class="nav-item" onclick="showModule('custos')">🧾 Custos</div>
<div class="nav-item" onclick="showModule('backup')">⚙️ Config</div>
</aside>

<!-- MAIN -->
<main class="main">

<section id="mod-indicadores">
<div class="stats" id="dashboard-stats"></div>

<div class="card">
<div class="card-title">Resumo</div>
<div style="height:120px;background:#f9fafb;border-radius:8px;display:flex;align-items:center;justify-content:center;">
Gráficos futuros
</div>
</div>
</section>

<section id="mod-ingredientes" class="hidden">
<div class="card">
<div class="card-title">
Ingredientes
<button class="btn btn-primary">+ Novo</button>
</div>
<div class="table-wrap">
<table>
<thead>
<tr><th>Nome</th><th>Preço</th></tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
</section>

</main>

<script>
function toggleSidebar(){
document.getElementById('sidebar').classList.toggle('open');
}

function showModule(id){
document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
document.getElementById('mod-'+id).classList.remove('hidden');
document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
event.target.classList.add('active');
if(window.innerWidth<900)toggleSidebar();
}
</script>

</body>
</html>
